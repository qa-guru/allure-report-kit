name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · test · pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npm run typecheck

      - name: Unit tests
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: npm test

      - run: node scripts/npm-pack-check.mjs

      - name: Job summary
        run: |
          {
            echo "## Release verify"
            echo ""
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- pack check: passed (no publish step in this workflow)"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
