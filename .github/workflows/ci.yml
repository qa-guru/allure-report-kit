name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs neither the forked bundles nor a browser.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action majors and the Node pin follow the monorepo SSOT
      # (generators/ethalon/tests-java/.github/_ethalon/gha-actions.yaml): bump
      # there and propagate, never ad-hoc in one repository.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npm run typecheck

      - name: Unit tests → Allure results
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: npm test

      - name: Coverage (unit, hard — lines/statements on src/)
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/.coverage-allure-tmp
        run: npm run coverage

      - name: Allure generate (unit)
        run: npm run allure:generate

      - name: Upload allure-results (unit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload allure-report (unit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-unit
          path: allure-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      # The vendored design-system copy must match its source. Without the
      # monorepo checked out there is nothing to compare against, and the script
      # says so and passes; run it in the monorepo to catch real drift.
      - run: npm run sync:ds:check

  # The soft-fork itself: build both bundles, generate real reports, smoke them.
  report:
    name: report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      # Install order is a dependency order — see scripts/setup.mjs.
      - run: npm run setup

      - name: typecheck the fork delta
        run: npm run typecheck:fork

      - name: install Chromium
        run: npx playwright install --with-deps chromium

      # Dogfood proves the manifest and the runtime; the reports prove the fork.
      - run: npm run report

      - name: Playwright smoke → Allure results
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results-e2e
          ALLURE_RESULTS_CLEAN: "1"
        run: npm run smoke:allure

      - name: Dogfood compare baseline
        run: npm run baseline

      - name: Watch smoke (informational)
        continue-on-error: true
        run: node scripts/smoke-watch.mjs

      - name: Allure generate (e2e)
        run: npx allure generate ./allure-results-e2e -o allure-report-e2e

      - name: upload the generated reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-reports
          path: e2e/allure-report
          retention-days: 7

      - name: Upload allure-results (e2e)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e
          path: allure-results-e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload allure-report (e2e)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-e2e
          path: allure-report-e2e/
          if-no-files-found: warn
          retention-days: 7

  sonar:
    name: Sonar (hard)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same-repo + SONAR_TOKEN: gate FAILED → fail job when SONAR_REQUIRED=true.
    # Forks / no token: soft-skip (script exits 0 even if SONAR_REQUIRED=true).

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Sonar scan + gate
        env:
          SONAR_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.SONAR_TOKEN || '' }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED || 'true' }}
          SONAR_PROJECT_KEY: allure-report-kit
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash scripts/ci-sonar.sh

      - name: Job summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
        run: |
          {
            echo "## Sonar (Q2 + Q5)"
            echo ""
            echo "- projectKey: \`allure-report-kit\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=allure-report-kit"
            echo "- SONAR_REQUIRED: \`${{ vars.SONAR_REQUIRED || 'true' }}\`"
            echo "- forks / no token: soft-skip"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  testops:
    name: TestOps (informational)
    needs: [unit, report]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational — never a merge blocker. Forks / missing ALLURE_* → soft-skip.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download allure-results (unit)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-unit
          path: allure-results-unit/

      - name: Download allure-results (e2e)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-e2e
          path: allure-results-e2e/

      - name: Merge results for upload
        run: |
          mkdir -p allure-results
          cp -R allure-results-unit/. allure-results/ 2>/dev/null || true
          cp -R allure-results-e2e/. allure-results/ 2>/dev/null || true

      - name: Gate (forks / secrets / results)
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ALLURE_TOKEN || '' }}
        run: |
          if [[ "$IS_FORK" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${ALLURE_PROJECT_ID}" || -z "${ALLURE_TOKEN}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -d allure-results ]] || [[ -z "$(ls -A allure-results 2>/dev/null)" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-results" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=upload" >> "$GITHUB_OUTPUT"

      - name: Install allurectl
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ vars.ALLURE_PROJECT_ID }}

      - name: Upload results to Allure TestOps
        if: steps.gate.outputs.skip == 'false' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        id: testops-upload
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
        run: |
          set +e
          export ALLURE_LAUNCH_NAME="allure-report-kit · ${{ github.ref_name }} · ${{ github.sha }}"
          allurectl upload allure-results 2>&1 | tee allurectl-upload.log
          UPLOAD_EXIT=${PIPESTATUS[0]}
          echo "upload_exit=${UPLOAD_EXIT}" >> "$GITHUB_OUTPUT"
          if [[ "$UPLOAD_EXIT" -eq 0 ]]; then
            LAUNCH_URL=$(grep -Eo 'https://[^ ]+/launch/[0-9]+' allurectl-upload.log | head -1 || true)
            if [[ -n "$LAUNCH_URL" ]]; then
              echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
            fi
          fi
          set -e

      - name: Job summary
        if: always()
        run: |
          {
            echo "## TestOps (informational / Q1)"
            echo ""
            echo "- skip: \`${{ steps.gate.outputs.skip || 'n/a' }}\` (${{ steps.gate.outputs.reason || 'n/a' }})"
            echo "- endpoint: \`${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}\`"
            echo "- project id: set \`vars.ALLURE_PROJECT_ID\` after creating the project on TestOps"
            if [[ -n "${{ steps.testops-upload.outputs.launch_url }}" ]]; then
              echo "- launch: ${{ steps.testops-upload.outputs.launch_url }}"
            fi
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  telegram:
    name: Telegram (dry-run / live)
    needs: [unit, report]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR / feature push: --dry-run (wiring must pass).
    # main + workflow_dispatch: --live when TELEGRAM_* present; else soft-skip.
    # Forks: never --live.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download allure-results (unit)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-unit
          path: allure-results-unit/

      - name: Download allure-results (e2e)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-e2e
          path: allure-results-e2e/

      - name: Merge results + generate report
        run: |
          mkdir -p allure-results
          cp -R allure-results-unit/. allure-results/ 2>/dev/null || true
          cp -R allure-results-e2e/. allure-results/ 2>/dev/null || true
          rm -rf allure-report
          npx --yes allure@3.14.3 generate ./allure-results -o allure-report
          test -f allure-report/summary.json

      - name: Gate (mode)
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN) || '' }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || '-1004381150566' }}
        run: |
          MODE=dry-run
          REASON=dry-run
          if [[ "$IS_FORK" == "true" ]]; then
            MODE=dry-run
            REASON=fork-dry-run
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ) ]]; then
            if [[ -n "${TELEGRAM_BOT_TOKEN}" && -n "${TELEGRAM_CHAT_ID}" ]]; then
              MODE=live
              REASON=live
            else
              MODE=skip
              REASON=missing-secrets
            fi
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Gate: mode=${MODE} reason=${REASON}"

      - name: Send Telegram collage
        id: send
        if: steps.gate.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          CLI_PIN: '6.0.13'
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID || '5321' }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN) || '' }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID || vars.TELEGRAM_ALLURE_REPORT_KIT_TOPIC_ID || '405' }}
        run: bash scripts/ci-telegram.sh

      - name: Upload collage artifact
        if: ${{ !cancelled() && steps.send.outputs.collage != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: collage-telegram
          path: collage-telegram.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          GATE_MODE: ${{ steps.gate.outputs.mode }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          SEND_MODE: ${{ steps.send.outputs.mode }}
          SEND_SOURCE: ${{ steps.send.outputs.source }}
          MESSAGE_ID: ${{ steps.send.outputs.message_id }}
          SEND_EXIT: ${{ steps.send.outputs.send_exit }}
        run: |
          {
            echo "## Telegram (Q4)"
            echo ""
            echo "- topic: slug \`allure-report-kit\` → id **405** (ADR 008)"
            echo "- CLI pin: \`allure-notifications@6.0.13\`"
            echo "- gate: \`${GATE_MODE}\` (\`${GATE_REASON}\`)"
            if [[ "${GATE_MODE}" == "skip" ]]; then
              echo "- status: soft-skip (missing TELEGRAM_* — not a merge blocker)"
            else
              echo "- send mode: \`${SEND_MODE:-${GATE_MODE}}\`"
              echo "- config source: \`${SEND_SOURCE:-n/a}\`"
              if [[ -n "${MESSAGE_ID}" ]]; then
                echo "- status: live sendPhoto ok"
                echo "- message_id: \`${MESSAGE_ID}\`"
              elif [[ "${GATE_MODE}" == "dry-run" || "${SEND_MODE}" == "dry-run" ]]; then
                if [[ "${SEND_EXIT}" == "0" ]]; then
                  echo "- status: dry-run ok (no network)"
                else
                  echo "- status: dry-run failed (wiring — fix required)"
                fi
              else
                echo "- status: live attempted (see job log; soft on API blip)"
              fi
            fi
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
